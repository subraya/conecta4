<div id="lang-form">
    <label>
      <input type="radio" [value]="'en'" (change)="setLocale('en')" [(ngModel)]="locale"> ENG
    </label>
    <label>
      <input type="radio" [value]="'es'" (change)="setLocale('es')" [(ngModel)]="locale"> ESP
    </label>
</div>

<div id="players-form">
    <div class="player-row">
        <div class="col"></div>
        <div class="col" translate>options.name</div>
        <div class="col" translate>options.type</div>
        <div class="col"></div>
    </div>
    <div class="player-row">
        <div class="col" translate>options.player1</div>
        <div class="col"><input type="text" [(ngModel)]="player1.name"></div>
        <div class="col">
            <select name="" [(ngModel)]="player1.type">
                <option [value]="'human'" translate>player.types.human</option>
                <option [value]="'cpu'" translate>player.types.cpu</option>
            </select>
        </div>
        <div class="col"></div>
    </div>
    <div class="player-row">
        <div class="col" translate>options.player2</div>
        <div class="col"><input type="text" [(ngModel)]="player2.name"></div>
        <div class="col">
            <select name="" [(ngModel)]="player2.type">
                <option [value]="'human'" translate>player.types.human</option>
                <option [value]="'cpu'" translate>player.types.cpu</option>
            </select>
        </div>
        <div class="col"></div>
    </div>
</div>

<div id="footer">
    <button (click)="goBack()" translate>options.buttons.back</button>
</div>
